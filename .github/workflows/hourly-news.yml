name: 每小時中文新聞推送

on:
  schedule:
    # UTC 時間；香港時間 = UTC+8。下面 = 香港時間每小時的 08 分
    - cron: "8 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只預覽、唔真的發送"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hourly-news
  cancel-in-progress: false

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Hong_Kong
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      # 去重記錄：優先由 cache 還原，就算 repo 冇 state/ 都唔會出事
      - name: 還原去重記錄
        uses: actions/cache@v4
        with:
          path: state
          key: news-state-${{ github.run_id }}
          restore-keys: |
            news-state-

      # 診斷：淨用內建指令，就算 pip 衰咗都跑到，用嚟睇檔案結構同 Secrets 狀態
      - name: 環境診斷
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          echo "=== 工作目錄 ==="
          pwd
          echo "=== 檔案結構 ==="
          find . -maxdepth 3 -not -path './.git/*' -not -path '*/__pycache__*' | sort | head -60
          echo "=== Python 版本 ==="
          python3 --version
          echo "=== Secrets 狀態（只顯示長度，唔會洩漏內容）==="
          python3 - <<'PY'
          import os
          for k in ["TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_IDS"]:
              v = os.environ.get(k, "") or ""
              print(f"  {k}: {'✅ 已設定（長度 ' + str(len(v)) + '）' if v else '❌ 冇設定 / 名唔啱'}")
          PY

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests PyYAML python-dotenv
          echo "=== 驗證套件裝好未 ==="
          python -c "import feedparser, requests, yaml; print('✅ feedparser / requests / PyYAML 全部就緒')"

      # 體檢：驗 Token、Chat ID、Bot 權限；只印長度同名稱，唔會洩漏秘密
      - name: 檢查設定
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python check_setup.py

      - name: 抓取並推送新聞
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # 以下全部可選，唔設定就用 config.yaml 嘅預設值
          MAX_TOTAL: ${{ vars.MAX_TOTAL }}
          MAX_AGE_HOURS: ${{ 
