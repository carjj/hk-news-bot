name: 每小時中文新聞推送

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: state
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install feedparser requests PyYAML

      - name: 推送新聞
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python main.py

      - name: 儲存去重記錄
        if: always()
        continue-on-error: true
        run: |
          mkdir -p state
          [ -f state/sent.json ] || echo '{"sent":{}}' > state/sent.json
          git config user.name news-bot
          git config user.email news-bot@users.noreply.github.com
          git add state/sent.json
          git diff --staged --quiet || {
            git commit -m "chore: update state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          }
