name: 每小時中文新聞推送

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: state
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install feedparser requests PyYAML

      - name: 推送新聞
        id: push
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          set +e
          {
            echo "=== 時間 (HKT) ==="
            TZ=Asia/Hong_Kong date
            echo "=== 檔案清單 ==="
            ls -la
            echo "=== Secrets 狀態（只顯示長度）==="
            python3 -c "import os; [print(' ', k, len(os.environ.get(k,'')) if os.environ.get(k) else 'MISSING') for k in ['TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_IDS']]"
            echo "=== 執行 main.py ==="
            python3 main.py 2>&1
            echo "=== exit code = $? ==="
          } 2>&1 | tee diag.txt

      - name: 上載診斷報告
        if: always()
        continue-on-error: true
        run: |
          git config user.name news-bot
          git config user.email news-bot@users.noreply.github.com
          git add -f diag.txt
          git diff --staged --quiet || {
            git commit -m "diag: run report [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          }
