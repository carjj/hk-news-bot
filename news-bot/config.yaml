# ============================================================
#  新聞來源設定  ·  全部經過實測可用（繁簡中文）
#  你可以自由增刪；category 決定會放入邊個版塊
# ============================================================

settings:
  # 每次推送最多幾單新聞（各版塊相加）
  max_total: 14
  # 同一個版塊入面，同一間媒體最多出幾單（避免單一媒體洗版）
  max_per_source: 2
  # 兩次推送之間最短相隔幾多分鐘（防止 GitHub cron + cron-job.org 重複推）
  min_interval_minutes: 45
  # 只推送呢個小時數內發佈 / 更新的新聞（舊嘢唔推）
  max_age_hours: 12
  # 相似標題視為「同一單新聞」的門檻（0–1，越大越嚴）
  dupe_threshold: 0.42
  # 標題最少要有幾多成中文字先當中文（濾走英文新聞）
  cjk_min_ratio: 0.25
  # 冇新新聞時唔好出空訊息
  skip_if_empty: true

# 版塊：決定推送順序、數量同開關
sections:
  - key: hk
    title: "🇭🇰 香港"
    limit: 6
    enabled: true
  - key: world
    title: "🌍 國際"
    limit: 6
    enabled: true
  - key: finance
    title: "💰 財經"
    limit: 3
    enabled: false      # 想要財經版塊改做 true
  - key: tech
    title: "🔬 科技"
    limit: 3
    enabled: false      # 想要科技版塊改做 true

# 同一單新聞有幾間媒體報道時，優先顯示邊間（越前越優先）
